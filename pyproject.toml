[project]
name = "create-junior"
version = "0.1.0"
description = "A local-first furniture recreation and DIY customization workbench"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
    "playwright>=1.49,<2",
    "pypdfium2>=4.30,<6",
    "pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
