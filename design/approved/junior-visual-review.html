function quantity(raw,unit='mm'){
  const s=String(raw).replace(/\s/g,'').replace(/−/g,'-').toLowerCase();
  if(!s)return NaN;
  const tokens=s.match(/[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:mm|cm|m|°|deg)?/g);
  if(!tokens||tokens.join('')!==s)return NaN;
  let total=0;
  for(let i=0;i<tokens.length;i++){
    if(i>0&&!/^[+-]/.test(tokens[i]))return NaN;
    const m=tokens[i].match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))(mm|cm|m|°|deg)?$/);
    const u=m[2]||unit;
    if(unit==='°'&&!['°','deg'].includes(u)||unit!=='°'&&['°','deg'].includes(u))return NaN;
    const factors={mm:1,cm:10,m:1000,'°':1,deg:1};
    total+=Number(m[1])*factors[u]/factors[unit];
  }
  return Math.round(total*100)/100;
}

  function boardMarkup(){
