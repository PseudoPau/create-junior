&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {

  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;

  );

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next

   */

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

  const fileElement = document.getElementById(&quot;codex-preview-files&quot;);

    }
    if (fileElement != null) {
      const files = parse(fileElement.textContent);
      fileElement.remove();
      const blobs = new Map();
      const urls = [];
      for (const [name, binding] of Object.entries(bindings)) {

            Uint8Array.from(atob(file.base64), (char) =&gt; char.charCodeAt(0));

      get bindings() {
        return bindings;

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

    postToHost(&quot;height&quot;, {

          document.body.scrollHeight,

        ),
      ),

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

#junior-visual-review .wf {

  --fill: light-dark(#f3f4ee, #34382f);

  --on-strong: light-dark(#ffffff, #251b16);

  --wood: light-dark(#d4b98c, #b79d75);
  --wood-light: light-dark(#e2cca6, #cbb48b);
  --wood-dark: light-dark(#b89b6e, #8d7755);
  --wood-edge: light-dark(#a58b66, #d2ba92);

  color: var(--ink);

  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: clip;
}
#junior-visual-review .wf * { box-sizing: border-box; }
#junior-visual-review .wf button,
#junior-visual-review .wf input,
#junior-visual-review .wf select,
#junior-visual-review .wf textarea { font: inherit; color: var(--ink); max-width: 100%; }
#junior-visual-review .wf button {

#junior-visual-review .wf button:hover { background: var(--fill); border-color: var(--quiet); }
#junior-visual-review .wf button:disabled { opacity: .42; cursor: default; }

#junior-visual-review .wf input,
#junior-visual-review .wf textarea,

#junior-visual-review .wf input[type=&quot;radio&quot;] { width: auto; accent-color: var(--strong); }
#junior-visual-review .wf textarea { resize: vertical; min-height: 100px; }
#junior-visual-review .wf h2 { font-size: 24px; font-weight: 600; line-height: 1.35; letter-spacing: -.6px; margin: 0 0 12px; }

#junior-visual-review .wf-head { display: flex; align-items: center; gap: 22px; min-height: 62px; padding: 12px 24px; border-bottom: 1px solid var(--line); }

#junior-visual-review .wf-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 650px; }

#junior-visual-review .dimension-label { position: absolute; z-index: 2; transform: translate(-50%, -50%); display: flex; gap: 4px; align-items: center; background: var(--paper); border: 1px solid var(--strong); border-radius: 7px; padding: 3px; }

#junior-visual-review .wf details { margin-top: 18px; }

#junior-visual-review .wf .reference { display: grid; grid-template-columns: 86px 1fr; align-items: center; gap: 14px; margin: 22px 0; padding: 0; border: 0; }
#junior-visual-review .wf .reference-figure { display: grid; place-items: center; width: 86px; height: 100px; border-radius: 8px; background: var(--canvas); color: var(--quiet); overflow: hidden; }
#junior-visual-review .wf .reference small { display: block; margin-top: 4px; }

#junior-visual-review .wf .body-person { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 16px 0 20px; }

/* Visual-review adapter for the repository&#x27;s six-board CAFE sample.
 * This is an explicit sample constraint, not a general furniture/CAD solver.
 * No API calls, persistence, or fabrication claims. Coordinates are millimetres.
 */
function adaptJuniorGeometry(reference, state = {}, boardPlans = {}) {
  const result = JSON.parse(JSON.stringify(reference));
  const limitations = [];
  const parts = result.parts;
  const byId = Object.fromEntries(parts.map(p =&gt; [p.id, p]));
  const baseById = Object.fromEntries(reference.parts.map(p =&gt; [p.id, p]));
  const required = [&#x27;seat&#x27;, &#x27;back&#x27;, &#x27;side_left&#x27;, &#x27;side_right&#x27;, &#x27;foot_left&#x27;, &#x27;foot_right&#x27;];
  if (required.some(id =&gt; !byId[id]) || parts.length !== 6) {
    return {...result, limitations:[&#x27;这把椅子尚未定义尺寸联动规则，当前保留原始模型。&#x27;], adaptationSupported:false};
  }
  const close = (a,b) =&gt; Math.abs(Number(a)-Number(b)) &lt; .001;
  const positive = (value, fallback) =&gt; Number.isFinite(Number(value)) &amp;&amp; Number(value)&gt;0 ? Number(value) : fallback;
  const baseSeat = baseById.seat, baseBack = baseById.back;
  const [baseWidth, thickness, baseDepth] = baseSeat.size_mm;
  const baseHeight = baseSeat.position_mm[1] + thickness/2;
  const plans = boardPlans || {};
  const requested = {
    height: state.height ?? baseHeight,
    seatWidth: plans.seat?.width ?? state.seatWidth ?? baseWidth,
    seatDepth: plans.seat?.length ?? state.seatDepth ?? baseDepth,
    seatTilt: state.seatTilt ?? 0,
    backAngle: state.backAngle ?? 100
  };
  function supported(value, fallback, min, max, label) {
    const n=Number(value);
    if (!Number.isFinite(n) || n&lt;min || n&gt;max) {
      limitations.push(`${label}超出当前样例可预览范围（${min}–${max} mm），保留 ${fallback} mm。`);
      return fallback;
    }
    return n;
  }
  const height = supported(requested.height,baseHeight,250,650,&#x27;座高&#x27;);
  const width = supported(requested.seatWidth,baseWidth,240,700,&#x27;座宽&#x27;);
  const depth = supported(requested.seatDepth,baseDepth,170,600,&#x27;座深&#x27;);
  const dh=height-baseHeight, dw=width-baseWidth, dd=depth-baseDepth;
  const angle=baseBack.rotation_deg[0]*Math.PI/180;
  const rearShift=-dh*Math.tan((100-90)*Math.PI/180);
  const expected = {
    seat:{length:depth,width,thickness},
    back:{length:baseBack.size_mm[2],width:baseBack.size_mm[0],thickness:baseBack.size_mm[1]},
    sides:{length:height-thickness,width:baseById.side_left.size_mm[1],thickness:baseById.side_left.size_mm[0]},
    feet:{length:baseById.foot_left.size_mm[2],width:baseById.foot_left.size_mm[1],thickness:baseById.foot_left.size_mm[0]}
  };
  if (!close(requested.seatTilt,0) || !close(requested.backAngle,100)) {
    limitations.push(&#x27;座面倾角与座背夹角需要重新计算斜切和连接孔轴；当前模型保持 0° / 100°。&#x27;);
  }
  if (state.thickness != null &amp;&amp; !close(state.thickness,thickness)) {

  }
  const labels={seat:&#x27;座板&#x27;,back:&#x27;靠背板&#x27;,sides:&#x27;侧立板&#x27;,feet:&#x27;底脚&#x27;};
  for (const key of Object.keys(expected)) {
